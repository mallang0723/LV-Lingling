<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>령령의 제작실 QA</title>
<link rel="icon" href="data:,">
<style>
/* Stand-ins for Lumiverse 1.2.5: the ViewportDrawer (frontend/src/components/panels/ViewportDrawer.module.css) and the
   float widget wrapper (frontend/src/components/spindle/SpindleFloatWidget.module.css, copied rule for rule).
   Static defaults from frontend/src/theme/variables.css; the theme engine overrides most of them per theme
   (qa/host-themes.json via qa.setTheme) but never --lumiverse-bg-opaque / --lumiverse-card-bg-solid. */
:root{--lumiverse-bg:rgba(28,24,38,.95);--lumiverse-bg-opaque:rgb(28 24 38);--lumiverse-card-bg-solid:rgb(24,20,34);--lumiverse-bg-elevated:rgba(35,30,48,.9);--lumiverse-bg-deep:rgba(10,8,18,1);--lumiverse-text:rgba(255,255,255,.9);--lumiverse-text-muted:rgba(255,255,255,.65);--lumiverse-text-dim:rgba(255,255,255,.4);--lumiverse-border:rgba(147,112,219,.12);--lumiverse-border-neutral:rgba(128,128,128,.15);--lumiverse-primary:rgba(147,112,219,.9);--lumiverse-primary-contrast:#fff;--lumiverse-danger:#ef4444;--lumiverse-shadow-lg:0 8px 24px #0006;--lumiverse-shadow-xl:0 12px 36px #0008}
html,body{margin:0;height:100%;background:var(--lumiverse-bg-deep);color:var(--lumiverse-text);font-family:system-ui,sans-serif}
.chat{position:fixed;inset:0;padding:16px;color:#888;overflow:hidden}
.chat .composer{position:absolute;left:12px;right:12px;bottom:12px;height:48px;border:1px solid #666;border-radius:10px;display:flex;align-items:center;padding:0 12px}
.wrapper{position:fixed;top:0;right:0;bottom:0;display:none;z-index:10}
.wrapper.on{display:flex}
.drawer{display:flex;height:100%;width:480px;background:var(--lumiverse-bg);box-shadow:0 0 24px #0008}
.sidebar{width:56px;flex:none;border-right:1px solid var(--lumiverse-border-neutral)}
.panel{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.header{min-height:48px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--lumiverse-border-neutral);font-weight:600}
.panelContent{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;padding:12px 12px 0;position:relative}
@media (max-width:600px){.drawer{width:100vw;flex-direction:column}.sidebar{width:100%;height:58px;border-right:0;border-bottom:1px solid var(--lumiverse-border-neutral)}}
.widget{position:fixed;z-index:9980;border-radius:12px;background:var(--lumiverse-bg);border:1px solid var(--lumiverse-border);box-shadow:var(--lumiverse-shadow-lg);cursor:grab;touch-action:none;user-select:none;overflow:hidden;contain:layout style;transition:box-shadow .15s ease}
.widget:active{cursor:grabbing;box-shadow:var(--lumiverse-shadow-xl)}
.widget.chromeless{background:transparent;border:none;box-shadow:none;border-radius:0;overflow:visible}
.widget.chromeless:active{box-shadow:none}
.widget.chromeless .content{overflow:visible;contain:none}
.widget.fullscreen{border-radius:0;cursor:default;touch-action:auto}
.widget .content{width:100%;height:100%;overflow:hidden;contain:layout style;pointer-events:auto}
.widget.chromeless.fullscreen .content{overflow:hidden}
#modals{position:fixed;inset:0;z-index:12000;display:none;align-items:center;justify-content:center;background:#0008}
#modals.on{display:flex}
#modals .m{background:var(--lumiverse-bg-elevated);color:var(--lumiverse-text);border-radius:12px;padding:16px;width:min(440px,92vw);max-height:90vh;overflow:auto}
#modals .m button{min-height:44px;padding:0 16px;margin:8px 8px 0 0}
</style>
</head>
<body>
<div class="chat">본편 채팅 화면 (QA 대역)<div class="composer">입력창</div></div>
<div class="wrapper" id="drawer"><div class="drawer"><div class="sidebar"></div><div class="panel"><div class="header">드로어</div><div class="panelContent" id="panelContent"><div id="tab-host"></div></div></div></div></div>
<div id="modals"></div>
<script type="module" src="./harness.js"></script>
</body>
</html>
